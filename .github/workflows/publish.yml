name: Publish to PyPI

# Publishes when a version tag (v0.3.0, v1.0.0, ...) is pushed. The tag must
# match the workspace package version in rust/Cargo.toml.
#
# Uses PyPI trusted publishing (OIDC): no API token is stored in GitHub.
# One-time setup on pypi.org: project "llama-extract-bench" -> Publishing -> add a
# GitHub publisher with owner run-llama, repo ExtractBench, workflow
# publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]

jobs:
  native-wheels:
    uses: ./.github/workflows/native-wheels.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches package version
        run: |
          pkg_version=$(uv run --no-project python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust/Cargo.toml").read_text())["workspace"]["package"]["version"])')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $pkg_version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: [build, native-wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          pattern: native-wheel-*
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
