name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # Lint and validate runner-free pass/skip behavior before installing heavy deps.
      - name: Sync dependencies (dev only)
        run: uv sync --locked --extra dev

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Check leaderboard row order
        run: |
          uv run python - <<'PY'
          import csv
          from pathlib import Path

          for name in ("leaderboard.csv", "leaderboard-pro.csv"):
              with Path(name).open(encoding="utf-8", newline="") as file:
                  providers = [row["Provider"] for row in csv.DictReader(file)]
              if providers != sorted(providers, key=str.casefold):
                  raise SystemExit(f"{name}: rows must be in alphabetical order by Provider")
          PY

      - name: Check README leaderboards
        run: uv run python scripts/update_readme.py --check

      - name: Pytest without runners
        run: uv run pytest tests/ -q

      - name: Sync dependencies (with runners)
        run: uv sync --locked --extra runners --extra dev

      - name: Pytest with runners
        run: uv run pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv build
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/extract-bench version
          /tmp/smoke/bin/extract-bench pipelines > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
