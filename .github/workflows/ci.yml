name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native-wheels:
    uses: ./.github/workflows/native-wheels.yml

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked

  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Lint and validate runner-free pass/skip behavior before installing heavy deps.
      - name: Sync dependencies (dev only)
        run: uv sync --locked --extra dev

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Pytest without runners
        run: uv run pytest tests/ -q

      - name: Sync dependencies (with runners)
        run: uv sync --locked --extra runners --extra dev

      - name: Pytest with runners
        run: uv run pytest tests/ -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: uv build
      - name: Build wheel from the source distribution
        run: uv build dist/*.tar.gz --wheel --out-dir dist/from-sdist
      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/extract-bench version
          /tmp/smoke/bin/extract-bench pipelines > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
