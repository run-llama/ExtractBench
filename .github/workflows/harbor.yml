name: Harbor smoke

on:
  pull_request:
    paths:
      - src/extract_bench/harbor/**
      - src/extract_bench/evaluation/evaluators/extract.py
      - src/extract_bench/evaluation/metrics/extract/unified_evidence_metric.py
      - tests/test_harbor.py
      - scripts/smoke_harbor.py
      - .github/workflows/harbor.yml

permissions:
  contents: read

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv tool install harbor==0.24.0 --python 3.12
      - run: uv run python scripts/smoke_harbor.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harbor-smoke
          path: output/harbor-smoke
